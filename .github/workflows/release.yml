name: Build and publish release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v0.2.0"
        required: true
        type: string
      release_notes:
        description: "Release notes in Markdown"
        required: true
        type: string
      prerelease:
        description: "Publish this release as a pre-release"
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          vulkan_version: 1.4.341.1
          install_runtime: false
          cache: true

      - name: Configure
        run: cmake --preset windows-release

      - name: Build VST3 and Standalone
        run: cmake --build --preset windows-release --parallel 2

      - name: Package Windows artifacts
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          $safeTag = $env:RELEASE_TAG -replace '[^A-Za-z0-9._-]', '-'
          $stage = Join-Path $env:RUNNER_TEMP "NoWave-Windows"
          $standalone = Join-Path $env:GITHUB_WORKSPACE "build\release\NoWave_artefacts\Release\Standalone\NoWave.exe"
          $vst3 = Join-Path $env:GITHUB_WORKSPACE "build\release\NoWave_artefacts\Release\VST3\NoWave.vst3"
          $ufbxLicense = Join-Path $env:GITHUB_WORKSPACE "build\release\_deps\ufbx-src\LICENSE"
          $archive = Join-Path $env:GITHUB_WORKSPACE "NoWave-$safeTag-Windows.zip"

          if (!(Test-Path $standalone)) {
            throw "Standalone executable was not produced: $standalone"
          }
          if (!(Test-Path $vst3)) {
            throw "VST3 bundle was not produced: $vst3"
          }
          if (!(Test-Path $ufbxLicense)) {
            throw "ufbx license was not found: $ufbxLicense"
          }

          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item $standalone -Destination $stage
          Copy-Item $vst3 -Destination $stage -Recurse
          $licenseDirectory = Join-Path $stage "THIRD_PARTY_LICENSES"
          New-Item -ItemType Directory -Force -Path $licenseDirectory | Out-Null
          Copy-Item $ufbxLicense -Destination (Join-Path $licenseDirectory "ufbx-LICENSE.txt")
          Compress-Archive -Path (Join-Path $stage '*') -DestinationPath $archive -Force

      - name: Build Windows installer
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          choco install innosetup --yes --no-progress
          $safeTag = $env:RELEASE_TAG -replace '[^A-Za-z0-9._-]', '-'
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          $installer = Join-Path $env:GITHUB_WORKSPACE "NoWave-$safeTag-Windows-Installer.exe"
          $env:NOWAVE_RELEASE_TAG = $safeTag

          if (!(Test-Path $iscc)) {
            throw "Inno Setup compiler was not found: $iscc"
          }
          & $iscc "/O$env:GITHUB_WORKSPACE" "/FNoWave-$safeTag-Windows-Installer" "packaging\windows\NoWave.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          if (!(Test-Path $installer)) {
            throw "Windows installer was not produced: $installer"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoWave-Windows
          path: |
            NoWave-*-Windows.zip
            NoWave-*-Windows-Installer.exe
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            glslc libvulkan-dev mesa-vulkan-drivers \
            libasound2-dev libjack-jackd2-dev ladspa-sdk \
            libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev \
            libglu1-mesa-dev mesa-common-dev

      - name: Configure
        run: cmake --preset linux-release

      - name: Build VST3 and Standalone
        run: cmake --build --preset linux-release --parallel 2

      - name: Package Linux artifacts
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          safe_tag="$(printf '%s' "$RELEASE_TAG" | sed 's/[^A-Za-z0-9._-]/-/g')"
          stage="$RUNNER_TEMP/NoWave-Linux"
          standalone="$GITHUB_WORKSPACE/build/linux-release/NoWave_artefacts/Release/Standalone/NoWave"
          vst3="$GITHUB_WORKSPACE/build/linux-release/NoWave_artefacts/Release/VST3/NoWave.vst3"
          ufbx_license="$GITHUB_WORKSPACE/build/linux-release/_deps/ufbx-src/LICENSE"
          archive="$GITHUB_WORKSPACE/NoWave-$safe_tag-Linux.tar.gz"

          test -x "$standalone" || { echo "Standalone executable was not produced: $standalone"; exit 1; }
          test -d "$vst3" || { echo "VST3 bundle was not produced: $vst3"; exit 1; }
          test -f "$ufbx_license" || { echo "ufbx license was not found: $ufbx_license"; exit 1; }

          mkdir -p "$stage"
          cp "$standalone" "$stage/"
          cp -a "$vst3" "$stage/"
          mkdir -p "$stage/THIRD_PARTY_LICENSES"
          cp "$ufbx_license" "$stage/THIRD_PARTY_LICENSES/ufbx-LICENSE.txt"
          tar -czf "$archive" -C "$stage" .

      - name: Build Linux installer
        env:
          RELEASE_TAG: ${{ inputs.tag_name }}
        run: |
          safe_tag="$(printf '%s' "$RELEASE_TAG" | sed 's/[^A-Za-z0-9._-]/-/g')"
          version="$(printf '%s' "$RELEASE_TAG" | sed -E 's/^v//; s/-/~/g; s/[^A-Za-z0-9.+~]/./g; s/[.+~]+$//')"
          [[ "$version" =~ ^[0-9] ]] || { echo "Release tag must produce a Debian version starting with a digit"; exit 1; }
          package_root="$RUNNER_TEMP/nowave-deb"
          installer="$GITHUB_WORKSPACE/NoWave-$safe_tag-Linux-Installer.deb"
          standalone="$GITHUB_WORKSPACE/build/linux-release/NoWave_artefacts/Release/Standalone/NoWave"
          vst3="$GITHUB_WORKSPACE/build/linux-release/NoWave_artefacts/Release/VST3/NoWave.vst3"
          ufbx_license="$GITHUB_WORKSPACE/build/linux-release/_deps/ufbx-src/LICENSE"

          test -x "$standalone" || { echo "Standalone executable was not produced: $standalone"; exit 1; }
          test -d "$vst3" || { echo "VST3 bundle was not produced: $vst3"; exit 1; }
          test -f "$ufbx_license" || { echo "ufbx license was not found: $ufbx_license"; exit 1; }

          mkdir -p "$package_root/DEBIAN" \
            "$package_root/usr/bin" \
            "$package_root/usr/lib/vst3" \
            "$package_root/usr/share/applications" \
            "$package_root/usr/share/doc/nowave/THIRD_PARTY_LICENSES"
          sed "s/@VERSION@/$version/" packaging/linux/control > "$package_root/DEBIAN/control"
          cp "$standalone" "$package_root/usr/bin/NoWave"
          cp -a "$vst3" "$package_root/usr/lib/vst3/"
          cp packaging/linux/nowave.desktop "$package_root/usr/share/applications/nowave.desktop"
          cp "$ufbx_license" "$package_root/usr/share/doc/nowave/THIRD_PARTY_LICENSES/ufbx-LICENSE.txt"
          chmod 755 "$package_root/usr/bin/NoWave"
          dpkg-deb --build --root-owner-group "$package_root" "$installer"
          dpkg-deb --info "$installer"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NoWave-Linux
          path: |
            NoWave-*-Linux.tar.gz
            NoWave-*-Linux-Installer.deb
          if-no-files-found: error

  publish-release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: NoWave-Windows
          path: release-artifacts

      - name: Download Linux artifacts
        uses: actions/download-artifact@v4
        with:
          name: NoWave-Linux
          path: release-artifacts

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: NoWave ${{ inputs.tag_name }}
          body: ${{ inputs.release_notes }}
          prerelease: ${{ inputs.prerelease }}
          files: |
            release-artifacts/NoWave-*-Windows.zip
            release-artifacts/NoWave-*-Windows-Installer.exe
            release-artifacts/NoWave-*-Linux.tar.gz
            release-artifacts/NoWave-*-Linux-Installer.deb
          fail_on_unmatched_files: true
          make_latest: ${{ !inputs.prerelease }}
